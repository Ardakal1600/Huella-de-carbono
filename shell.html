<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora Huella de Carbono</title>
    <!-- Librería para generar código QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas.emscripten {
            border: 0px none;
            background-color: #000;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Overlay para ingresar el nombre */
        #input-container {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        #nombreInput {
            padding: 12px 20px;
            font-size: 18px;
            border-radius: 8px;
            border: 2px solid #4CAF50;
            outline: none;
            text-align: center;
            width: 280px;
        }

        /* Contenedor del Código QR */
        #qr-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5;
        }

        #qr-text {
            color: #000;
            font-size: 10px;
            font-weight: bold;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            #qr-container {
                bottom: 10px;
                right: 10px;
                transform: scale(0.8);
            }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Entrada para el nombre -->
        <div id="input-container">
            <input type="text" id="nombreInput" placeholder="Ingresa tu nombre..." oninput="EnviarNombreAC()">
        </div>

        <!-- Canvas donde dibuja Raylib -->
        <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>

        <!-- Código QR -->
        <div id="qr-container">
            <div id="qrcode"></div>
            <span id="qr-text">Escanea para abrir</span>
        </div>
    </div>

    <script type="text/javascript">
        var Module = {
            preRun: [],
            postRun: [],
            print: (function() { return function(text) { console.log(text); }; })(),
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                return canvas;
            })()
        };

        // 1. Enviar nombre tipeado al entorno C
        function EnviarNombreAC() {
            var nombre = document.getElementById('nombreInput').value;
            if (Module._ActualizarNombreDesdeJS) {
                var ptr = allocateUTF8(nombre);
                Module._ActualizarNombreDesdeJS(ptr);
                _free(ptr);
            }
        }

        // 2. Ocultar el Input cuando se presione comenzar
        function OcultarInputNombre() {
            var container = document.getElementById('input-container');
            if (container) {
                container.style.display = 'none';
            }
        }

        // 3. Enviar datos a Google Sheets usando fetch sin bloqueo CORS
        function EnviarAGoogleSheets(nombre, huella) {
            var webAppUrl = "https://script.google.com/macros/s/AKfycbx_TU_URL_AQUI/exec"; // Reemplaza por tu URL activa de Apps Script

            var payload = {
                nombre: nombre,
                huella: huella
            };

            fetch(webAppUrl, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).then(function() {
                console.log("Datos enviados a Google Sheets con éxito.");
            }).catch(function(err) {
                console.error("Error al enviar datos:", err);
            });
        }

        // 4. Generar Código QR del sitio web automáticamente
        window.addEventListener('load', function() {
            new QRCode(document.getElementById("qrcode"), {
                text: window.location.href,
                width: 80,
                height: 80
            });
        });
    </script>
    {{{ SCRIPT }}}
</body>
</html>
